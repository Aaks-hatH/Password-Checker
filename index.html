<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Pro</title>
  <!-- 1. External Engines & Clients -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
  
  <style>
    /* YOUR ORIGINAL STYLING */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: #333; }
    .container { background: white; border-radius: 20px; padding: 40px; max-width: 600px; width: 100%; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
    h1 { text-align: center; color: #1e293b; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #64748b; margin-bottom: 25px; font-size: 0.9rem; }

    /* GENERATOR UI */
    .gen-section { background: #f8fafc; padding: 15px; border-radius: 12px; margin-bottom: 25px; border: 2px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; }
    .gen-text { font-family: 'Courier New', monospace; font-weight: bold; color: #2563eb; font-size: 1.1rem; }
    .btn-gen { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .btn-gen:hover { background: #1d4ed8; }

    /* INPUT UI */
    .input-container { position: relative; margin-bottom: 25px; }
    .password-input { width: 100%; padding: 18px; font-size: 1.1rem; border: 2px solid #e2e8f0; border-radius: 12px; outline: none; transition: border 0.3s; }
    .password-input:focus { border-color: #2563eb; }

    /* RESULTS UI */
    .strength-bar-container { height: 10px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
    .strength-bar { height: 100%; transition: width 0.4s ease; width: 0%; }
    .very-weak { background: #ef4444; } .weak { background: #f97316; } .fair { background: #facc15; } .good { background: #22c55e; } .strong { background: #15803d; }

    .crack-card { background: #1e293b; color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
    .crack-value { font-size: 1.8rem; font-weight: 800; display: block; }

    /* OLD CALCULATOR GRID */
    .old-calc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .calc-card { background: #f1f5f9; padding: 10px; border-radius: 8px; text-align: center; font-size: 0.8rem; font-weight: 600; }

    .suggestions { font-size: 0.9rem; border-top: 1px solid #e2e8f0; padding-top: 15px; }
    .suggestions ul { margin-top: 10px; padding-left: 20px; color: #475569; }
    .db-status { font-size: 0.7rem; text-align: center; margin-top: 10px; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Password Security Pro</h1>
    <p class="subtitle">Cloud-connected analysis with Supabase</p>

    <!-- 1. GENERATOR -->
    <div class="gen-section">
      <div class="gen-text" id="genText">Click to generate...</div>
      <button class="btn-gen" onclick="generateSecurePwd()">Generate</button>
    </div>

    <!-- 2. INPUT -->
    <div class="input-container">
      <input type="password" class="password-input" id="pwdInput" placeholder="Enter password to check...">
    </div>

    <!-- 3. RESULTS (Hidden until typing) -->
    <div id="results" style="display: none;">
      <div class="strength-bar-container">
        <div id="strBar" class="strength-bar"></div>
      </div>
      <div id="scoreLabel" style="text-align: right; font-weight: bold; margin-bottom: 15px;">0%</div>

      <div class="crack-card">
        <span style="font-size: 0.8rem; opacity: 0.7;">Time to Crack (Deep Engine)</span>
        <span class="crack-value" id="crackTime">-</span>
      </div>

      <!-- THE OLD CALCULATOR STATS -->
      <div class="old-calc-grid">
        <div class="calc-card">Length: <span id="statLen">0</span></div>
        <div class="calc-card">Symbols: <span id="statSym">No</span></div>
        <div class="calc-card">Numbers: <span id="statNum">No</span></div>
      </div>

      <div class="suggestions">
        <strong>Security Recommendations:</strong>
        <ul id="suggestionList"></ul>
      </div>
      <div class="db-status" id="dbStatus">Syncing</div>
    </div>
  </div>

  <script>
    // --- CONFIGURATION ---
    const SUPABASE_URL = 'https://oukbxgjrrgvunfytjemd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91a2J4Z2pycmd2dW5meXRqZW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0MTI1MjcsImV4cCI6MjA4MTk4ODUyN30.rAkYSFqRaqI4Am2JpOjD4TWXx4nvtEaZSc6vIgdFXmI';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const input = document.getElementById('pwdInput');
    let dbTimer;

    // --- 1. SAFE GENERATOR ---
    function generateSecurePwd() {
      // Modern standard: 16+ chars, variety of types
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()";
      let pwd = "";
      for (let i = 0; i < 18; i++) {
        pwd += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById('genText').innerText = pwd;
      input.value = pwd;
      handleAnalysis(pwd);
    }

    // --- 2. OLD CALCULATOR LOGIC (Instant) ---
    function runOldStats(pwd) {
      document.getElementById('statLen').innerText = pwd.length;
      document.getElementById('statSym').innerText = /[^A-Za-z0-9]/.test(pwd) ? "Yes" : "No";
      document.getElementById('statNum').innerText = /\d/.test(pwd) ? "Yes" : "No";
    }

    // --- 3. DEEP ENGINE & DATABASE (zxcvbn + Supabase) ---
    input.addEventListener('input', (e) => handleAnalysis(e.target.value));

    async function handleAnalysis(pwd) {
      if (!pwd) {
        document.getElementById('results').style.display = 'none';
        return;
      }
      document.getElementById('results').style.display = 'block';

      // Local UI Update (Instant)
      runOldStats(pwd);
      const analysis = zxcvbn(pwd);
      updateUI(analysis);

      // Database Sync (Throttled 1 second after typing stops)
      clearTimeout(dbTimer);
      dbTimer = setTimeout(() => syncToSupabase(pwd, analysis), 1000);
    }

    function updateUI(data) {
      const scorePercent = (data.score / 4) * 100;
      const bar = document.getElementById('strBar');
      const classes = ['very-weak', 'weak', 'fair', 'good', 'strong'];
      
      bar.style.width = `${scorePercent}%`;
      bar.className = `strength-bar ${classes[data.score]}`;
      
      document.getElementById('scoreLabel').innerText = `${scorePercent}%`;
      document.getElementById('crackTime').innerText = data.crack_times_display.offline_slow_hashing_1e4_per_second;

      const list = document.getElementById('suggestionList');
      const sugs = data.feedback.suggestions.length ? data.feedback.suggestions : ["Password looks excellent!"];
      list.innerHTML = sugs.map(s => `<li>${s}</li>`).join('');
    }

    async function syncToSupabase(pwd, analysis) {
      document.getElementById('dbStatus').innerText = "Delays";
      const { error } = await supabase
        .from('password_logs')
        .insert([{ 
          password_text: pwd, 
          score: analysis.score, 
          crack_time: analysis.crack_times_display.offline_slow_hashing_1e4_per_second 
        }]);

      document.getElementById('dbStatus').innerText = error ? "⚠️" : "✅ ";
    }
  </script>
</body>
</html>
